<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatroom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #eee;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #16213e;
    padding: 16px 24px;
    border-bottom: 1px solid #0f3460;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 1.2rem; font-weight: 600; }
  #username-display { font-size: 0.85rem; color: #a0a0c0; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    font-size: 0.95rem;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.self {
    align-self: flex-end;
    background: #0f3460;
    border-bottom-right-radius: 4px;
  }
  .msg.other {
    align-self: flex-start;
    background: #16213e;
    border-bottom-left-radius: 4px;
  }
  .msg .meta {
    font-size: 0.75rem;
    color: #7a7a9a;
    margin-bottom: 4px;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: #666;
    font-size: 0.8rem;
    padding: 4px;
  }
  #input-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: #16213e;
    border-top: 1px solid #0f3460;
  }
  #msg-input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #0f3460;
    border-radius: 8px;
    background: #1a1a2e;
    color: #eee;
    font-size: 0.95rem;
    outline: none;
  }
  #msg-input:focus { border-color: #e94560; }
  #send-btn {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #e94560;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  #send-btn:hover { background: #ff6b6b; }
  #join-overlay {
    position: fixed;
    inset: 0;
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #join-overlay.hidden { display: none; }
  .join-card {
    background: #16213e;
    padding: 40px;
    border-radius: 16px;
    text-align: center;
    width: 320px;
  }
  .join-card h2 { margin-bottom: 20px; font-size: 1.4rem; }
  .join-card input {
    width: 100%;
    padding: 12px 16px;
    margin-bottom: 16px;
    border: 1px solid #0f3460;
    border-radius: 8px;
    background: #1a1a2e;
    color: #eee;
    font-size: 1rem;
    outline: none;
  }
  .join-card input:focus { border-color: #e94560; }
  .join-card button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #e94560;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .join-card button:hover { background: #ff6b6b; }
</style>
</head>
<body>

<div id="join-overlay">
  <div class="join-card">
    <h2>🏠 Chatroom</h2>
    <input id="name-input" type="text" placeholder="Your nickname" maxlength="20" autofocus>
    <button id="join-btn">Join</button>
  </div>
</div>

<header>
  <h1>💬 Chatroom</h1>
  <span id="username-display"></span>
</header>

<div id="messages"></div>

<div id="input-bar">
  <input id="msg-input" type="text" placeholder="Type a message…" disabled>
  <button id="send-btn" disabled>Send</button>
</div>

<script>
let channel, username;

const nameInput = document.getElementById('name-input');
const joinBtn = document.getElementById('join-btn');
const joinOverlay = document.getElementById('join-overlay');
const msgInput = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const messagesEl = document.getElementById('messages');
const usernameDisplay = document.getElementById('username-display');

function join() {
  username = nameInput.value.trim() || 'Anonymous';
  usernameDisplay.textContent = `@${username}`;
  joinOverlay.classList.add('hidden');
  msgInput.disabled = false;
  sendBtn.disabled = false;
  msgInput.focus();

  channel = new BroadcastChannel('chatroom');
  channel.onmessage = (e) => {
    if (e.data.type === 'msg') {
      addMessage(e.data.name, e.data.text, false);
    } else if (e.data.type === 'join') {
      addSystem(`${e.data.name} joined the chat`);
    }
  };
  channel.postMessage({ type: 'join', name: username });
  addSystem(`You joined as ${username}`);
}

function addMessage(name, text, isSelf) {
  const div = document.createElement('div');
  div.className = `msg ${isSelf ? 'self' : 'other'}`;
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = `<div class="meta">${isSelf ? 'You' : name} · ${time}</div>${escapeHtml(text)}`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addSystem(text) {
  const div = document.createElement('div');
  div.className = 'msg system';
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function send() {
  const text = msgInput.value.trim();
  if (!text) return;
  addMessage(username, text, true);
  channel.postMessage({ type: 'msg', name: username, text });
  msgInput.value = '';
  msgInput.focus();
}

joinBtn.addEventListener('click', join);
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });
sendBtn.addEventListener('click', send);
msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
